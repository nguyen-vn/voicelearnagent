<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1080" viewBox="0 0 1770 1080" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <style>
      .h   { font-size: 19px; font-weight: 700; fill: #0F172A; }
      .t   { font-size: 16px; font-weight: 700; fill: #0F172A; }
      .b   { font-size: 14px; fill: #334155; }
      .s   { font-size: 13px; fill: #64748B; }
      .m   { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .lab { font-size: 12.5px; fill: #475569; font-weight: 600; }
      .num { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .ln  { stroke: #475569; stroke-width: 2; fill: none; }
      .ext { stroke: #C2410C; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .cfg { stroke: #64748B; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="1770" height="1080" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="58" font-size="30" font-weight="800" fill="#0F172A">VoiceLearn Agent — System Architecture</text>
  <text x="40" y="90" font-size="16" fill="#64748B">One conversational turn: voice, text or a document goes in, a spoken answer comes out. Every provider has a real and a mock implementation behind the same interface.</text>

  <!-- ===================== Column 1: input / output ===================== -->
  <rect x="40" y="130" width="270" height="360" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="60" y="170" class="h">Student input</text>
  <g>
    <rect x="58" y="192" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="217" class="t">Voice question</text>
    <text x="74" y="239" class="s">microphone or audio file</text>
    <rect x="58" y="264" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="289" class="t">Typed question</text>
    <text x="74" y="311" class="s">text box, Enter to send</text>
    <rect x="58" y="336" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="361" class="t">Documents</text>
    <text x="74" y="383" class="s">PDF / PNG / JPG / WEBP, ≤ 20 MB</text>
    <rect x="58" y="408" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="433" class="t">Options</text>
    <text x="74" y="455" class="s">language · voice · mode · web search</text>
  </g>

  <rect x="40" y="540" width="270" height="370" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="60" y="580" class="h">Answer to the student</text>
  <g>
    <rect x="58" y="602" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="627" class="t">Spoken answer</text>
    <text x="74" y="649" class="s">MP3 (real) / WAV beep (mock)</text>
    <rect x="58" y="674" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="699" class="t">Chat history</text>
    <text x="74" y="721" class="s">last 6 turns re-sent to the LLM</text>
    <rect x="58" y="746" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="771" class="t">Transcript</text>
    <text x="74" y="793" class="s">what speech-to-text heard</text>
    <rect x="58" y="818" width="234" height="60" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="74" y="843" class="t">Web sources</text>
    <text x="74" y="865" class="s">links from Google Search grounding</text>
  </g>

  <!-- ===================== Column 2: app.py ===================== -->
  <rect x="380" y="130" width="240" height="780" rx="14" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="400" y="170" class="h m">app.py</text>
  <text x="400" y="194" class="s">Gradio Blocks, single page</text>

  <rect x="398" y="222" width="204" height="150" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="414" y="250" class="t">Triggers</text>
  <text x="414" y="277" class="b">Send button</text>
  <text x="414" y="301" class="b">Enter in the text box</text>
  <text x="414" y="325" class="b">Stop recording</text>
  <text x="414" y="347" class="s">→ auto-send (hands-free)</text>

  <rect x="398" y="420" width="204" height="120" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="414" y="450" class="t m">handle_turn()</text>
  <text x="414" y="477" class="b m">agent.run(...)</text>
  <text x="414" y="502" class="b">returns a TurnResult</text>
  <text x="414" y="524" class="s">question, answer, audio…</text>

  <rect x="398" y="590" width="204" height="150" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="414" y="618" class="t">Render outputs</text>
  <text x="414" y="645" class="b">autoplay audio</text>
  <text x="414" y="669" class="b">chat + transcript</text>
  <text x="414" y="693" class="b">sources + status</text>
  <text x="414" y="717" class="s">then clear the inputs</text>

  <text x="400" y="790" class="s">Status bar shows the mode,</text>
  <text x="400" y="810" class="s">e.g. "LLM: MOCK · Voice: MOCK"</text>

  <!-- arrows column 1 <-> 2 -->
  <path d="M310,310 L376,310" class="ln" marker-end="url(#arr)"/>
  <path d="M398,665 L345,665 L345,725 L314,725" class="ln" marker-end="url(#arr)"/>
  <path d="M500,372 L500,416" class="ln" marker-end="url(#arr)"/>
  <path d="M500,540 L500,586" class="ln" marker-end="url(#arr)"/>

  <!-- ===================== Column 3: pipeline ===================== -->
  <rect x="690" y="130" width="470" height="780" rx="14" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="710" y="170" class="h"><tspan class="m">pipeline.py</tspan> · VoiceLearnAgent.run()</text>

  <!-- step 1 -->
  <rect x="710" y="200" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="738" cy="230" r="15" fill="#7C3AED"/><text x="738" y="235.5" text-anchor="middle" class="num">1</text>
  <text x="764" y="236" class="t">Speech-to-Text</text>
  <text x="764" y="266" class="b m">stt.transcribe(audio_path, language)</text>
  <text x="764" y="292" class="s">skipped when there is no recording</text>
  <!-- step 2 -->
  <rect x="710" y="340" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="738" cy="370" r="15" fill="#7C3AED"/><text x="738" y="375.5" text-anchor="middle" class="num">2</text>
  <text x="764" y="376" class="t">Build the question</text>
  <text x="764" y="406" class="b">typed text + transcript, whitespace cleaned</text>
  <text x="764" y="432" class="s">file only → default request for the mode</text>
  <!-- step 3 -->
  <rect x="710" y="480" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="738" cy="510" r="15" fill="#7C3AED"/><text x="738" y="515.5" text-anchor="middle" class="num">3</text>
  <text x="764" y="516" class="t">Load attachments</text>
  <text x="764" y="546" class="b">check extension and size (≤ 20 MB)</text>
  <text x="764" y="572" class="s">→ raw bytes + MIME type, no OCR needed</text>
  <!-- step 4 -->
  <rect x="710" y="620" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="738" cy="650" r="15" fill="#7C3AED"/><text x="738" y="655.5" text-anchor="middle" class="num">4</text>
  <text x="764" y="656" class="t">Ask the AI tutor</text>
  <text x="764" y="686" class="b">system prompt for mode + language,</text>
  <text x="764" y="710" class="b">last 6 turns, files, optional web search</text>
  <!-- step 5 -->
  <rect x="710" y="760" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="738" cy="790" r="15" fill="#7C3AED"/><text x="738" y="795.5" text-anchor="middle" class="num">5</text>
  <text x="764" y="796" class="t">Text-to-Speech</text>
  <text x="764" y="826" class="b">strip markdown / URLs, cut at sentence end</text>
  <text x="764" y="850" class="s">≤ TTS_MAX_CHARS → voice by language + gender</text>

  <!-- step flow -->
  <path d="M925,320 L925,336" class="ln" marker-end="url(#arr)"/>
  <path d="M925,460 L925,476" class="ln" marker-end="url(#arr)"/>
  <path d="M925,600 L925,616" class="ln" marker-end="url(#arr)"/>
  <path d="M925,740 L925,756" class="ln" marker-end="url(#arr)"/>

  <!-- arrows column 2 <-> 3 -->
  <path d="M602,465 L686,465" class="ln" marker-end="url(#arr)"/>
  <text x="646" y="456" text-anchor="middle" class="lab m">run()</text>
  <path d="M690,860 L655,860 L655,700 L606,700" class="ln" marker-end="url(#arr)"/>
  <text x="664" y="885" text-anchor="middle" class="lab">result</text>

  <!-- ===================== Column 4: provider modules ===================== -->
  <text x="1220" y="170" class="h">Provider modules</text>
  <text x="1220" y="190" class="s m">voicelearn/</text>

  <rect x="1220" y="200" width="290" height="120" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1240" y="234" class="t m">stt.py</text>
  <text x="1240" y="264" class="b">ElevenLabsSTT · MockSTT</text>
  <text x="1240" y="290" class="s">language code vie / eng</text>

  <rect x="1220" y="340" width="290" height="120" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1240" y="374" class="t m">text_utils.py</text>
  <text x="1240" y="404" class="b m">normalize_question()</text>
  <text x="1240" y="430" class="s m">prompts.DEFAULT_FILE_REQUEST</text>

  <rect x="1220" y="480" width="290" height="120" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1240" y="514" class="t m">documents.py</text>
  <text x="1240" y="544" class="b m">load_attachments()</text>
  <text x="1240" y="570" class="s">.pdf .png .jpg .jpeg .webp</text>

  <rect x="1220" y="620" width="290" height="120" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1240" y="654" class="t m">llm.py + prompts.py</text>
  <text x="1240" y="684" class="b">GeminiTutor · MockTutor</text>
  <text x="1240" y="710" class="s m">build_system_prompt(mode, lang)</text>

  <rect x="1220" y="760" width="290" height="120" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1240" y="794" class="t m">tts.py + text_utils.py</text>
  <text x="1240" y="824" class="b">ElevenLabsTTS · MockTTS</text>
  <text x="1240" y="850" class="s m">prepare_for_speech()</text>

  <!-- arrows column 3 -> 4 -->
  <path d="M1140,260 L1216,260" class="ln" marker-end="url(#arr)"/>
  <path d="M1140,400 L1216,400" class="ln" marker-end="url(#arr)"/>
  <path d="M1140,540 L1216,540" class="ln" marker-end="url(#arr)"/>
  <path d="M1140,680 L1216,680" class="ln" marker-end="url(#arr)"/>
  <path d="M1140,820 L1216,820" class="ln" marker-end="url(#arr)"/>

  <!-- ===================== Column 5: cloud APIs ===================== -->
  <text x="1560" y="170" class="h">Cloud APIs</text>
  <text x="1560" y="190" class="s">real mode only</text>

  <rect x="1560" y="200" width="170" height="120" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="1576" y="234" class="t">ElevenLabs</text>
  <text x="1576" y="264" class="b">Speech-to-Text</text>
  <text x="1576" y="290" class="s m">scribe_v2</text>

  <rect x="1560" y="620" width="170" height="120" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="1576" y="654" class="t">Google Gemini</text>
  <text x="1576" y="684" class="b m">gemini-3.8-flash</text>
  <text x="1576" y="710" class="s">+ Search grounding</text>

  <rect x="1560" y="760" width="170" height="120" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="1576" y="794" class="t">ElevenLabs</text>
  <text x="1576" y="824" class="b">Text-to-Speech</text>
  <text x="1576" y="850" class="s m">eleven_flash_v2_5</text>

  <!-- arrows column 4 -> 5 (network) -->
  <path d="M1510,260 L1556,260" class="ext" marker-end="url(#arrO)"/>
  <path d="M1510,680 L1556,680" class="ext" marker-end="url(#arrO)"/>
  <path d="M1510,820 L1556,820" class="ext" marker-end="url(#arrO)"/>

  <!-- ===================== Bottom: config + legend ===================== -->
  <rect x="690" y="950" width="1040" height="100" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="710" y="982" class="t"><tspan class="m">config.py</tspan> · Settings, loaded from <tspan class="m">.env</tspan></text>
  <text x="710" y="1008" class="b">No GEMINI_API_KEY or MOCK_MODE=1 → MockTutor.   No ELEVENLABS_API_KEY or MOCK_MODE=1 → MockSTT + MockTTS.</text>
  <text x="710" y="1032" class="s"><tspan class="m">build_components()</tspan> picks real or mock providers once at start-up. The pipeline never knows which one it is calling.</text>
  <path d="M1365,950 L1365,884" class="cfg" marker-end="url(#arr)"/>

  <rect x="40" y="950" width="580" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="982" class="t">Legend</text>
  <path d="M60,1008 L120,1008" class="ln" marker-end="url(#arr)"/>
  <text x="132" y="1013" class="b">data flow inside the process</text>
  <path d="M340,1008 L400,1008" class="ext" marker-end="url(#arrO)"/>
  <text x="412" y="1013" class="b">HTTPS call (real mode)</text>
  <text x="60" y="1037" class="s">tests/ — 28 pytest cases use fake SDK clients and need no network or API keys.</text>
</svg>
